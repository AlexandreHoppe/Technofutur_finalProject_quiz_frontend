

<form [formGroup]="createQuizForm" (submit)="createQuiz()">
    <h1>Créer un quiz</h1>
    <p>Configure le mode, la catégorie et le nom de ton quiz.</p>
    <div>
        <label for="quizName">Quiz Name</label>
        <input type="text" id="quizName"  placeholder="quiz Name" formControlName="quiz_name"/>
    </div>

    <div>
        <label for="questionLength">Number of Questions</label>
        <input type="number" id="questionLength" placeholder="Number of Questions" formControlName="quiz_length"/>
    </div>
    
    <div>
        <label for="quiz_type">Quiz Mode</label>
        <select id="quiz_type" formControlName="quiz_type">
            @if (quizTypeIs) {
                <option value="">Choose the quiz mode</option>
            }
            <option value="Text-Mode">Text Mode</option>
            <option value="Multiple-Choice">Multiple Choice</option>
            <option value="Party-Mode">Party Mode</option>
        </select>
    </div>

    <div>
        <label for="quiz_category">Quiz Category</label>
        <select id="quiz_category" formControlName="quiz_category">
            @if (quizCategoryIs) {
                <option value="">Choose the quiz category</option>
            }
            @for (category of question_categories; track category) {
                <option value="{{ category }}">{{ category }}</option>
            }
        </select>
    </div>

    <button type="submit">Create Quiz</button>
</form>
@if (submissionValidation) {
<div class="invalid-submission-overlay">
    <app-invalid-submission (newSubmissionValidation)="errorNoticed($event)" [missingRequirement]="quizValidation"/>   
</div>
}
